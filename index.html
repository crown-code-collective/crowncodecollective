<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/emblem-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="Crown Code Collective honors Black educational perseverance through ceremonial recognition, scholarships, leadership visibility, and an intergenerational alumni network. Recognition. Leadership. Culture. Community."
    />
    <meta property="og:title" content="Crown Code Collective" />
    <meta
      property="og:description"
      content="We are building community through recognition, leadership, culture, and educational perseverance."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap"
      rel="stylesheet"
    />
    <title>Crown Code Collective — Recognition. Leadership. Culture. Community.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Netlify Forms detection: static, hidden duplicates so the build bot
         registers the forms even though React renders them client-side. -->
    <form name="partners" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="organization" />
      <input type="email" name="email" />
      <input type="text" name="location" />
      <input type="text" name="partnership-interest" />
      <input type="text" name="social" />
      <input type="text" name="bot-field" />
    </form>
    <form name="alumni" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="school" />
      <input type="text" name="graduation-year" />
      <input type="email" name="email" />
      <input type="text" name="location" />
      <input type="text" name="profession" />
      <input type="text" name="social" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
